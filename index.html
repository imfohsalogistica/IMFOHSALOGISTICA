  let dpr=Math.max(1,window.devicePixelRatio||1),w=Math.max(420,parent?.clientWidth||600),h=250;c.width=w*dpr;c.height=h*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.font='12px system-ui';ctx.fillStyle='#617083';ctx.strokeStyle='#dfe7ef';let max=Math.max(1,...values);if(type==='doughnut'){let total=values.reduce((a,b)=>a+b,0)||1,cx=w*.36,cy=h*.5,r=82,start=-Math.PI/2;values.forEach((v,i)=>{let a=v/total*Math.PI*2;ctx.beginPath();ctx.strokeStyle=['#1769e0','#20a66a','#ef9b32','#d64a58','#6f55c6','#1e9eb0'][i%6];ctx.lineWidth=30;ctx.arc(cx,cy,r,start,start+a);ctx.stroke();start+=a});labels.forEach((x,i)=>{let y=42+i*25;ctx.fillStyle=['#1769e0','#20a66a','#ef9b32','#d64a58','#6f55c6','#1e9eb0'][i%6];ctx.fillRect(w*.68,y-9,10,10);ctx.fillStyle='#314159';ctx.fillText(String(x)+' · '+values[i],w*.68+16,y)})}else{let padL=42,padR=15,padT=20,padB=62,iw=w-padL-padR,ih=h-padT-padB,n=Math.max(1,values.length),bw=Math.max(10,iw/n*.58);for(let g=0;g<=4;g++){let y=padT+ih*g/4;ctx.strokeStyle='#edf1f5';ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.fillStyle='#7b8998';ctx.fillText(String(Math.round(max*(1-g/4))),4,y+4)}values.forEach((v,i)=>{let x=padL+(i+.5)*iw/n-bw/2,bh=v/max*ih,y=padT+ih-bh;ctx.fillStyle=['#1769e0','#20a66a','#ef9b32','#d64a58','#6f55c6','#1e9eb0'][i%6];ctx.fillRect(x,y,bw,bh);ctx.save();ctx.translate(x+bw/2,h-padB+8);ctx.rotate(-.55);ctx.fillStyle='#4b5b6d';ctx.textAlign='right';ctx.fillText(String(labels[i]??''),0,0);ctx.restore()})}}

function dashboardAlerts(date=selectedDate()){let a=[],oo=STATE.orders.filter(o=>o.date===date),today=date===localISODate();if(today){let now=Date.now(),grace=Number(STATE.settings.routeDispatchGraceMinutes||10),lateStart=STATE.messengers.filter(m=>m.routeAssignedAt&&!m.routeStartedAt&&(now-new Date(m.routeAssignedAt).getTime())>grace*60000),lateDone=STATE.messengers.filter(m=>Number(m.routeStartDelayMinutes||0)>0);if(lateStart.length)a.push(`🔴 ${lateStart.length} mensajero(s) aún no han salido y superaron la hora máxima.`);if(lateDone.length)a.push(`🔴 ${lateDone.length} mensajero(s) registraron retraso de salida.`);let waits=oo.filter(o=>o.status==='En cliente'&&minuteDiff(o.arrivedAt)>=Number(STATE.settings.waitAlertMinutes||5));if(waits.length){let crit=waits.filter(o=>minuteDiff(o.arrivedAt)>=Number(STATE.settings.maxWaitMinutes||15)).length;a.push(`${crit?'🔴':'🟡'} ${waits.length} mensajero(s) están esperando cliente 5 min o más${crit?` · ${crit} en límite de 15 min`:''}.`)}}else{let snap=snapshotFor(date),late=snap?.messengers?.filter(m=>Number(m.routeStartDelayMinutes||0)>0)||[];if(late.length)a.push(`🔴 ${late.length} mensajero(s) registraron salida tardía.`)}let un=oo.filter(o=>!o.messengerId).length;if(un)a.push(`🟠 ${un} paradas quedaron sin asignar.`);let snap=snapshotFor(date),veh=snap?.vehicles||(today?STATE.vehicles:[]),maint=veh.filter(v=>v.status==='Mantenimiento').length;if(maint)a.push(`🛠 ${maint} vehículo(s) en mantenimiento.`);return a}

    let a=orders.filter(o=>o.messengerId===m.id),rc=routeCache[routeKey(m.id,date)],km=rc?.km||estimateKm(m,a),mins=rc?.minutes||estimateMinutes(a,km),last=lastDeliveryTime(m,a,mins,date),isClosed=collapsed.has(m.id);

function estimateKm(m,a){if(!a.length)return 0;let c=center(m.centerId),pts=[[c.lat,c.lng],...a.map(o=>[o.lat,o.lng]),[c.lat,c.lng]],km=0;for(let i=1;i<pts.length;i++)km+=hav(pts[i-1],pts[i])*1.25;return km}

function initMap(el,centerPt,view='normal'){let node=typeof el==='string'?document.getElementById(el):el;if(!window.L){if(node)node.innerHTML='<div style="height:100%;display:grid;place-items:center;padding:20px;text-align:center;background:#e8eef5;color:#40536a"><div><b>Mapa temporalmente no disponible</b><br><span style="font-size:12px">Revise conexión a Internet. El resto de la plataforma continúa funcionando.</span></div></div>';return null}if(map){try{map.remove()}catch{}};map=L.map(el,{zoomControl:true}).setView(centerPt,12);let url=view==='light'?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png':'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';L.tileLayer(url,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);return map}

async function optimizeOne(mid,silent=false){let date=selectedDate(),m=person(mid),a=STATE.orders.filter(o=>o.messengerId===mid&&o.date===date),c=center(m?.centerId);if(!m||!c){if(!silent)toast('Mensajero o centro no configurado','err');return false}if(a.length<2){if(!silent)toast('Esta ruta tiene menos de 2 paradas');return false}let newA=[],usedRoad=false;try{let pts=[[c.lat,c.lng],...a.map(o=>[o.lat,o.lng])],t=await roadTable(pts),dist=t.distances;if(!Array.isArray(dist)||!dist.length)throw new Error('Matriz vial vacía');let left=a.map((o,i)=>({o,idx:i+1})),cur=0;while(left.length){left.sort((x,y)=>(dist[cur]?.[x.idx]??1e15)-(dist[cur]?.[y.idx]??1e15));let n=left.shift();newA.push(n.o);cur=n.idx}usedRoad=true}catch(e){console.warn('OSRM no disponible; usando respaldo geográfico',e);let left=[...a],cur=[c.lat,c.lng];while(left.length){left.sort((x,y)=>hav(cur,[x.lat,x.lng])-hav(cur,[y.lat,y.lng]));let n=left.shift();newA.push(n);cur=[n.lat,n.lng]}}let ids=new Set(a.map(o=>o.id)),all=STATE.orders,slots=all.map((o,i)=>ids.has(o.id)?i:-1).filter(i=>i>=0);newA.forEach((o,i)=>{all[slots[i]]=o});routeCache[routeKey(mid,date)]=null;if(!silent)await saveState((usedRoad?'Ruta optimizada por calles':'Ruta optimizada con respaldo geográfico')+' · '+date);return true}

function renderClients(){let q=sessionStorage.getItem('clientQ')||'',cc=STATE.clients.filter(c=>!q||(c.name+c.odoo+c.phone+c.address).toLowerCase().includes(q.toLowerCase()));$('#content').innerHTML=`<div class="pagehead"><div><h2>Clientes Odoo</h2><p>Base central con ubicación, importación masiva, cámara y escaneo.</p></div><div class="toolbar"><button class="btn btn-ghost" data-cmd="csvImportModal()">↥ Excel/CSV</button><button class="btn btn-ghost" data-cmd="photoOCRModal()">📷 Foto</button><button class="btn btn-ghost" data-cmd="scanCodeModal()">▥ QR / barras</button><button class="btn btn-primary" data-cmd="clientModal()">＋ Cliente</button></div></div><div class="card section"><input id="cq" class="input" placeholder="Buscar cliente, código, teléfono o dirección" value="${esc(q)}" style="width:min(520px,100%);margin-bottom:12px"><div class="tablewrap"><table class="table"><thead><tr><th>Código</th><th>Cliente</th><th>Teléfono</th><th>Dirección</th><th>Ubicación</th><th></th></tr></thead><tbody>${cc.map(c=>`<tr><td>${esc(c.odoo||'')}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'')}</td><td>${esc(c.address||'')}</td><td>${Number.isFinite(c.lat)&&Number.isFinite(c.lng)?badge('Ubicado'):badge('Ubicación pendiente')}</td><td><button class="btn btn-soft" data-cmd="clientModal('${c.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;$('#cq').oninput=e=>{sessionStorage.setItem('clientQ',e.target.value);renderClients()}}
function clientModal(id){let c=id?client(id):{id:'c'+Date.now(),odoo:'',name:'',phone:'',address:'',lat:'',lng:''};openModal(id?'Editar cliente':'Agregar cliente',`<div class="formgrid"><div class="field"><label>Código Odoo</label><input id="clOdoo" class="input" value="${esc(c.odoo)}"></div><div class="field"><label>Nombre</label><input id="clName" class="input" value="${esc(c.name)}"></div><div class="field"><label>Teléfono</label><input id="clPhone" class="input" value="${esc(c.phone)}"></div><div class="field wide"><label>Dirección de entrega</label><input id="clAddr" class="input" value="${esc(c.address)}"></div><div class="field"><label>Latitud</label><input id="clLat" class="input" type="number" step="any" value="${esc(c.lat)}"></div><div class="field"><label>Longitud</label><input id="clLng" class="input" type="number" step="any" value="${esc(c.lng)}"></div></div>`,[{text:'Guardar',cls:'btn-primary',fn:async()=>{let obj={...c,odoo:$('#clOdoo').value,name:$('#clName').value,phone:$('#clPhone').value,address:$('#clAddr').value,lat:Number($('#clLat').value),lng:Number($('#clLng').value)};if(!obj.name)return toast('Ingrese nombre','err');let dup=STATE.clients.find(x=>x.id!==obj.id&&((obj.odoo&&x.odoo===obj.odoo)||(obj.phone&&x.phone===obj.phone)));if(dup)return toast('Posible cliente duplicado','err');if(id)Object.assign(c,obj);else STATE.clients.push(obj);await saveState('Cliente guardado');closeModal();renderClients()}},{text:'Eliminar',cls:id?'btn-danger':'hidden',fn:async()=>{if(confirm('¿Eliminar cliente?')){STATE.clients=STATE.clients.filter(x=>x.id!==id);await saveState('Cliente eliminado');closeModal();renderClients()}}},{text:'Cerrar',fn:closeModal}])}
function csvImportModal(){openModal('Importar CSV / Excel exportado a CSV',`<p class="small">Reconoce encabezados como Nombre/Name, Teléfono/Phone/Mobile, Dirección/Street/Delivery Address, Código Odoo/External ID/Reference, Latitude/Longitude.</p><input id="csvfile" type="file" accept=".csv,text/csv" class="input"><div id="csvPreview" class="small" style="margin-top:10px"></div>`,[{text:'Importar',cls:'btn-primary',fn:async()=>{let f=$('#csvfile').files[0];if(!f)return;let txt=await f.text(),rows=parseCSV(txt);let added=0,upd=0;rows.forEach(r=>{let norm={};Object.keys(r).forEach(k=>norm[k.toLowerCase().trim()]=r[k]);let name=norm.nombre||norm.name;if(!name)return;let odoo=norm['código odoo']||norm['codigo odoo']||norm['external id']||norm.reference||'',phone=norm['teléfono']||norm.telefono||norm.phone||norm.mobile||'',address=norm['dirección']||norm.direccion||norm.street||norm['delivery address']||'',lat=Number(norm.latitud||norm.latitude),lng=Number(norm.longitud||norm.longitude),ex=STATE.clients.find(c=>(odoo&&c.odoo===odoo)||(phone&&c.phone===phone));if(ex){Object.assign(ex,{name,odoo:odoo||ex.odoo,phone:phone||ex.phone,address:address||ex.address,lat:Number.isFinite(lat)?lat:ex.lat,lng:Number.isFinite(lng)?lng:ex.lng});upd++}else{STATE.clients.push({id:'c'+Date.now()+Math.random(),odoo,name,phone,address,lat:Number.isFinite(lat)?lat:null,lng:Number.isFinite(lng)?lng:null});added++}});await saveState(`Importación: ${added} nuevos · ${upd} actualizados`);closeModal();renderClients()}},{text:'Cerrar',fn:closeModal}])}
function parseCSV(t){let lines=t.replace(/\r/g,'').split('\n').filter(Boolean),sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';let h=lines.shift().split(sep).map(x=>x.replace(/^"|"$/g,''));return lines.map(l=>{let a=l.split(sep).map(x=>x.replace(/^"|"$/g,'')),o={};h.forEach((k,i)=>o[k]=a[i]||'');return o})}

function hbarChart(items,{suffix='',money=false,maxItems=10}={}){let data=(items||[]).slice(0,maxItems),mx=Math.max(1,...data.map(x=>Number(x.value||0)));return `<div class="decision-bars">${data.map((x,i)=>{let pct=Math.max(4,Number(x.value||0)/mx*100),val=money?fmtQ(x.value):fmt1(x.value)+suffix;return `<div class="dbar"><div class="dbar-top"><b>${esc(x.label)}</b><span>${val}</span></div><div class="dbar-track"><i style="width:${pct}%"></i></div>${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div>`}).join('')||'<div class="small">Sin datos para el período.</div>'}</div>`}
function donutChart(items,centerTitle='Total'){let vals=(items||[]).map(x=>Math.max(0,Number(x.value||0))),sum=vals.reduce((a,b)=>a+b,0)||1,colors=['#2563eb','#16a34a','#f59e0b','#ef4444','#8b5cf6','#06b6d4'],pos=0,stops=[];vals.forEach((v,i)=>{let a=pos,b=pos+v/sum*360;stops.push(`${colors[i%colors.length]} ${a}deg ${b}deg`);pos=b});return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="donut-hole"><b>${fmt1(sum)}</b><span>${esc(centerTitle)}</span></div></div><div class="donut-legend">${items.map((x,i)=>`<div><i style="background:${colors[i%colors.length]}"></i><span>${esc(x.label)}</span><b>${fmt1(x.value)}</b></div>`).join('')}</div></div>`}
function sparkline(values){let a=(values||[]).map(Number),w=500,h=120,mn=Math.min(...a,0),mx=Math.max(...a,1),pts=a.map((v,i)=>`${a.length<2?w/2:i/(a.length-1)*w},${h-10-(v-mn)/(mx-mn||1)*(h-20)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
async function remoteCameraSession(label,owner,onComplete,{min=1,max=5,kind='evidence'}={}){try{let r=await api('/api/capture/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,owner,min,max,kind})}),id=r.id,url=r.url,phone=person(owner)?.phone||'',digits=String(phone).replace(/\D/g,''),wa=(digits.length===8?'https://wa.me/502'+digits:'https://wa.me/')+'?text='+encodeURIComponent(label+'\n'+url);openModal('📱 Tomar fotos desde el teléfono',`<div class="insight">Abra este enlace en el teléfono asignado. Las fotos aparecerán aquí en tiempo real.</div><div class="field"><label>Enlace de cámara</label><input id="remoteCamUrl" class="input" value="${esc(url)}" readonly></div><div class="list-actions" style="margin-top:10px"><button id="copyRemoteCam" class="btn btn-soft">📋 Copiar</button><button id="waRemoteCam" class="btn btn-primary">💬 Enviar al teléfono</button></div><div class="camera-box" style="margin-top:12px"><b>Fotos recibidas: <span id="remoteCount">0</span>/${max}</b><div id="remoteThumbs" class="thumbs"></div><div class="small" id="remoteHint">Esperando fotografías…</div></div>`,[{text:'Usar fotos recibidas',cls:'btn-primary',fn:async()=>{let st=await api('/api/capture/status?id='+encodeURIComponent(id));if((st.urls||[]).length<min)return toast(`Se requieren al menos ${min} foto(s)`,'err');await api('/api/capture/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});closeModal();onComplete?.(st.urls||[])}},{text:'Cerrar',fn:closeModal}]);$('#copyRemoteCam').onclick=()=>copyTextSafe(url);$('#waRemoteCam').onclick=()=>window.open(wa,'_blank');let timer=setInterval(async()=>{if(!document.getElementById('remoteCount')){clearInterval(timer);return}try{let st=await api('/api/capture/status?id='+encodeURIComponent(id)),urls=st.urls||[];$('#remoteCount').textContent=urls.length;$('#remoteThumbs').innerHTML=urls.map(x=>`<img class="thumb" src="${x}">`).join('');$('#remoteHint').textContent=urls.length>=min?'✓ Evidencia mínima recibida':'Esperando fotografías…'}catch{}},1800)}catch(e){toast('No se pudo crear enlace de cámara: '+e.message,'err')}}
function photoOCRModal(){remoteCameraSession('Fotografiar documento / ficha de cliente','',async urls=>{let u=urls[0];openModal('Foto recibida',`<img src="${u}" style="width:100%;border-radius:12px"><div class="insight">La fotografía ya quedó enlazada con la computadora. Complete o valide los datos del cliente antes de guardar.</div>`,[{text:'Crear cliente con esta evidencia',cls:'btn-primary',fn:()=>{closeModal();clientModal();setTimeout(()=>{let n=$('#clNotes');if(n)n.value='Evidencia fotográfica: '+u},80)}},{text:'Cerrar',fn:closeModal}])},{min:1,max:1,kind:'document'})}
function scanCodeModal(){openModal('Escanear QR / código de barras',`<p>Abra la cámara y coloque el código dentro del encuadre.</p><video id="scanVideo" autoplay playsinline style="width:100%;border-radius:12px;background:#111"></video><div id="scanResult" class="insight">Esperando código…</div>`,[{text:'Cerrar',fn:()=>{stopCamera();closeModal()}}]);startScanner()}
let activeStream=null;async function startScanner(){if(!('BarcodeDetector'in window)){toast('Este navegador no soporta escaneo nativo. Use Chrome/Edge reciente.','err');return}try{activeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=$('#scanVideo');v.srcObject=activeStream;let det=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','code_39']});let loop=async()=>{if(!$('#scanVideo'))return;try{let codes=await det.detect(v);if(codes.length){let val=codes[0].rawValue;$('#scanResult').innerHTML='<b>Detectado:</b> '+esc(val);let c=STATE.clients.find(x=>x.odoo===val||x.phone===val);if(c){stopCamera();closeModal();clientModal(c.id);return}}}catch{}requestAnimationFrame(loop)};loop()}catch{toast('Permiso de cámara rechazado','err')}}
function stopCamera(){if(activeStream){activeStream.getTracks().forEach(t=>t.stop());activeStream=null}}
function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

function renderMessengers(){let date=selectedDate(),now=new Date(),oo=ordersForDate(date),snap=snapshotFor(date),live=date===localISODate();let routeStatusFor=m=>live?m.routeStatus:(snap?.messengers?.find(x=>x.id===m.id)?.routeStatus||'Histórico');$('#content').innerHTML=`<div class="pagehead"><div><h2>Mensajeros</h2><p>${prettyDate(date)} · ${live?'estado en vivo':'consulta histórica'} de puntualidad, espera, retorno CEDI y liquidación.</p></div><button class="btn btn-primary" data-cmd="messengerModal()">＋ Mensajero / persona</button></div><div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px"><div class="card kpi"><div class="label">Con actividad</div><div class="value">${new Set(oo.map(o=>o.messengerId).filter(Boolean)).size}</div></div><div class="card kpi"><div class="label">En ruta</div><div class="value">${STATE.messengers.filter(m=>routeStatusFor(m)==='En ruta').length}</div></div><div class="card kpi"><div class="label">Retorno CEDI</div><div class="value">${STATE.messengers.filter(m=>routeStatusFor(m)==='Retorno CEDI').length}</div></div><div class="card kpi"><div class="label">Alertas espera</div><div class="value warn">${live?oo.filter(o=>o.status==='En cliente'&&minuteDiff(o.arrivedAt,now)>=5).length:0}</div></div></div><div class="cards3">${STATE.messengers.map(m=>messengerCard(m,now,date)).join('')}</div>`}
function messengerCard(m,now,date=selectedDate()){let a=STATE.orders.filter(o=>o.messengerId===m.id&&o.date===date),d=a.filter(o=>o.status==='Entregado').length,f=STATE.fuel.filter(x=>x.messengerId===m.id&&x.date===date),km=f.reduce((s,x)=>s+Number(x.kmReal||0),0),gas=f.reduce((s,x)=>s+Number(x.amount||0),0),dep=km*STATE.settings.depreciationPerKm,live=date===localISODate(),snap=snapshotFor(date),sm=snap?.messengers?.find(x=>x.id===m.id),status=live?(m.routeStatus||m.status):(sm?.routeStatus||'Histórico'),wait=live?a.filter(o=>o.status==='En cliente').map(o=>minuteDiff(o.arrivedAt,now)).sort((a,b)=>b-a)[0]||0:0,delay=live?Number(m.routeStartDelayMinutes||0):Number(sm?.routeStartDelayMinutes||0),assigned=live&&m.routeAssignedAt?new Date(m.routeAssignedAt):null,deadline=assigned?new Date(assigned.getTime()+Number(STATE.settings.routeDispatchGraceMinutes||10)*60000):null,pendingLate=live&&assigned&&!m.routeStartedAt&&Date.now()>deadline.getTime()?Math.floor((Date.now()-deadline.getTime())/60000):0;return `<div class="card person-card"><div style="display:flex;justify-content:space-between"><div><div class="name">${esc(m.name)}</div><div class="small">${m.type} · ${m.vehicle} · ${m.plate}</div></div>${badge(status)}</div><div class="alerts">${wait>=15?'<span class="pill status-red">🔴 Espera '+wait+' min</span>':wait>=10?'<span class="pill status-orange">🟠 Espera '+wait+' min</span>':wait>=5?'<span class="pill status-orange">🟡 Espera '+wait+' min</span>':''}${pendingLate?`<span class="pill status-red">Sin salir +${pendingLate} min</span>`:delay?`<span class="pill status-red">Salida +${delay} min</span>`:''}</div><div class="person-stats"><div class="statmini"><b>${d}/${a.length}</b><span>entregas</span></div><div class="statmini"><b>${fmt1(km)}</b><span>km reales</span></div><div class="statmini"><b>${fmtQ(gas+dep)}</b><span>a pagar</span></div></div>${assigned?`<div class="small" style="margin-top:8px">Ruta enviada: ${assigned.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'})} · salida máx. ${deadline.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'})}</div>`:''}<div class="list-actions" style="margin-top:12px"><button class="btn btn-soft" data-cmd="shareDriver('${m.id}')">🔗 Compartir ruta</button><button class="btn btn-ghost" data-cmd="messengerModal('${m.id}')">Editar</button></div></div>`}
function shareDriver(mid){let d=selectedDate();window.open('/compartir-ruta?mid='+encodeURIComponent(mid)+'&date='+encodeURIComponent(d),'_blank')}

function periodRows(period='day'){return fuelForPeriod(period,selectedDate())}
function renderFuel(){let anchor=selectedDate(),period=sessionStorage.getItem('fuelPeriod')||'day',rows=periodRows(period),orders=ordersForPeriod(period,anchor),km=rows.reduce((s,x)=>s+Number(x.kmReal||0),0),gas=rows.reduce((s,x)=>s+Number(x.amount||0),0),dep=rows.reduce((s,x)=>s+Number(x.depreciation||x.kmReal*STATE.settings.depreciationPerKm||0),0),delOrders=orders.filter(o=>o.status==='Entregado'),deliveries=delOrders.length,cost=gas+dep,avg=deliveries?cost/deliveries:0,grouped=STATE.messengers.map(m=>({label:m.name,value:rows.filter(x=>x.messengerId===m.id).reduce((s,x)=>s+Number(x.amount||0)+Number(x.depreciation||0),0)})).filter(x=>x.value).sort((a,b)=>b.value-a.value),profit=orders.reduce((s,o)=>s+Number(o.amount||0),0)-cost;$('#content').innerHTML=`<div class="pagehead"><div><h2>Combustible, costos y rentabilidad</h2><p>${periodLabel(period,anchor)} · lectura global e individual para toma de decisiones.</p></div><div class="toolbar"><select id="fuelPeriod" class="select"><option value="day">Diario</option><option value="week" ${period==='week'?'selected':''}>Semanal</option><option value="month" ${period==='month'?'selected':''}>Mensual</option></select><button class="btn btn-ghost" id="fuelDash">📊 Dashboard</button><button class="btn btn-primary" id="fuelAdd">＋ Registro</button></div></div><div class="kpis"><div class="card kpi"><div class="label">Combustible</div><div class="value">${fmtQ(gas)}</div></div><div class="card kpi"><div class="label">Depreciación</div><div class="value">${fmtQ(dep)}</div></div><div class="card kpi"><div class="label">KM reales</div><div class="value">${fmt1(km)}</div></div><div class="card kpi"><div class="label">Costo / entrega</div><div class="value">${fmtQ(avg)}</div></div><div class="card kpi"><div class="label">Resultado asociado</div><div class="value ${profit>=0?'good':'bad'}">${fmtQ(profit)}</div></div></div><div class="report-grid" style="margin-top:15px"><div class="card section"><h3>💰 Costo operativo por mensajero</h function fuelModal(){openModal('Registrar combustible',`<div class="formgrid"><div class="field"><label>Mensajero</label><select id="fuMid" class="select">${STATE.messengers.map(m=>`<option value="${m.id}">${m.name}</option>`)}</select></div><div class="field"><label>Fecha</label><input id="fuDate" type="date" class="input" value="${selectedDate()}"></div><div class="field"><label>KM reales (odómetro)</label><input id="fuKm" type="number" class="input"></div><div class="field"><label>Precio / galón</label><input id="fuPrice" type="number" class="input" value="${STATE.settings.fuelPrice}"></div></div><div class="insight">Rendimiento automático: Moto 125cc = ${STATE.settings.moto125KmPerGallon} km/gal · Moto 150cc = ${STATE.settings.moto150KmPerGallon} km/gal · Depreciación = ${fmtQ(STATE.settings.depreciationPerKm)}/km.</div>`,[{text:'Calcular y guardar',cls:'btn-primary',fn:async()=>{let m=person($('#fuMid').value),km=Number($('#fuKm').value),eff=m.vehicle.includes('150')?STATE.settings.moto150KmPerGallon:m.vehicle.includes('125')?STATE.settings.moto125KmPerGallon:30,gal=km/eff,price=Number($('#fuPrice').value);if(!km||km<0)return toast('Ingrese KM reales válidos','err');STATE.fuel.push({id:'f'+Date.now(),date:$('#fuDate').value||selectedDate(),messengerId:m.id,vehicle:m.vehicle,amount:gal*price,pricePerGallon:price,gallons:gal,kmReal:km,kmPerGallon:eff,costPerKm:(gal*price)/km,depreciation:km*STATE.settings.depreciationPerKm});await saveState('Combustible calculado');closeModal();renderFuel()}},{text:'Cerrar',fn:closeModal}])}

function renderFleet(){let date=selectedDate(),live=date===localISODate(),snap=snapshotFor(date),vehicles=fleetStateForDate(date),assignments=(STATE.panelAssignments||[]).filter(a=>a.date===date),available=vehicles.filter(v=>v.status==='Disponible').length;$('#content').innerHTML=`<div class="pagehead"><div><h2>Flotilla</h2><p>${prettyDate(date)} · ${live?'estado actual editable':'snapshot histórico'}.</p></div><div class="toolbar"><button class="btn btn-ghost" id="fleetAssign">🚐 Asignar panel</button><button class="btn btn-primary" id="fleetNew">＋ Vehículo</button></div></div>${!live&&!snap?'<div class="insight">No existe snapshot de flotilla para esta fecha.</div>':''}<div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px"><div class="card kpi"><div class="label">Vehículos</div><div class="value">${vehicles.length}</div></div><div class="card kpi"><div class="label">Disponibles</div><div class="value good">${available}</div></div><div class="card kpi"><div class="label">Mantenimiento</div><div class="value warn">${vehicles.filter(v=>v.status==='Mantenimiento').length}</div></div><div class="card kpi"><div class="label">Asignaciones panel</div><div class="value">${assignments.length}</div></div></div><div class="cards3">${vehicles.map(v=>`<div class="card person-card"><div style="display:flex;justify-content:space-between"><div><div class="name">${v.brand} ${v.model}</div><div class="small">${v.type} · ${v.plate}</div></div>${badge(v.status)}</div><div class="person-stats"><div class="statmini"><b>${fmt1(v.mileage)}</b><span>km</span></div><div class="statmini"><b>${v.kmPerGallon||'—'}</b><span>km/gal</span></div><div class="statmini"><b>${esc(person(v.assignedTo)?.name||'—')}</b><span>asignado</span></div></div>${live?`<div class="field" style="margin-top:10px"><label>Estado operativo</label><select class="select" data-fleet-status="${v.id}">${['Disponible','Asignado','Mantenimiento','Fuera de servicio'].map(x=>`<option ${x===v.status?'sel function reportTabHTML(tab,period='day'){let orders=ordersForPeriod(period,selectedDate()),fuel=fuelForPeriod(period,selectedDate()),del=orders.filter(o=>o.status==='Entregado').length,total=orders.length,cost=fuel.reduce((s,x)=>s+Number(x.amount||0)+Number(x.depreciation||0),0),km=fuel.reduce((s,x)=>s+Number(x.kmReal||0),0),fleetData=fleetStateForDate(periodBounds(period,selectedDate())[1]),ms=STATE.messengers.filter(m=>m.type==='Ruta'),deliverBy=ms.map(m=>({label:m.name,value:orders.filter(o=>o.messengerId===m.id&&o.status==='Entregado').length,note:`${orders.filter(o=>o.messengerId===m.id).length} asignadas`})).sort((a,b)=>b.value-a.value),statusItems=['Entregado','En ruta','Asignado','Pendiente','No entregado'].map(x=>({label:x,value:orders.filter(o=>o.status===x).length}));if(tab==='summary')return `<div class="kpis"><div class="card kpi"><div class="label">Entregas</div><div class="value">${del}</div></div><div class="card kpi"><div class="label">Cumplimiento</div><div class="value">${fmt1(total?del/total*100:0)}%</div></div><div class="card kpi"><div class="label">KM reales</div><div class="value">${fmt1(km)}</div></div><div class="card kpi"><div class="label">Costo operativo</div><div class="value">${fmtQ(cost)}</div></div><div class="card kpi"><div class="label">Costo / entrega</div><div class="value">${fmtQ(del?cost/del:0)}</div></div></div><div class="report-grid" style="margin-top:15px"><div class="card section"><h3>📦 Entregas por mensajero</h3>${hbarChart(deliverBy,{maxItems:8})}</div><div class="card section"><h3>📊 Estado de la operación</h3>${donutChart(statusItems,'pedidos')}</div></div><div class="card section" style="margin-top:15px"><h3>Lectura ejecutiva</h3><div class="insight">Costo promedio por entrega: <b>${fmtQ(del?cost/del:0)}</b>.</div><div class="insight">Mensajero con más entregas: <b>${esc(deliverBy[0]?.label||'—')}</b> (${deliverBy[0]?.value||0}).</div><div class="insight">Vehículos en mantenimiento: <b>${fleetData.filter(v=>v.status==='Mantenimiento').length}</b>.</div></div>`;if(tab==='messaging'){let scores=ms.map(m=>{let a=orders.filter(o=>o.messengerId===m.id),d=a.filter(o=>o.status==='Entregado').length,k=fuel.filter(f=>f.messengerId===m.id).reduce((s,x)=>s+Number(x.kmReal||0),0);return {label:m.name,value:a.length?(d/a.length*70+Math.min(30,d/Math.max(k,1)*100)):0,note:`${d}/${a.length} entregadas · ${fmt1(k)} km`}}).sort((a,b)=>b.value-a.value);let cuts=STATE.settings.cuts.map(c=>({label:c,value:orders.filter(o=>o.cut===c&&o.status==='Entregado').length}));return `<div class="report-grid"><div class="card section"><h3>🏆 Ranking de eficiencia</h3>${hbarChart(scores,{suffix:'%',maxItems:8})}</div><div class="card section"><h3>⏰ Entregas por corte</h3>${hbarChart(cuts)}</div></div>`}if(tab==='fleet'){let st=['Disponible','Asignado','Mantenimiento','Fuera de servicio'].map(x=>({label:x,value:fleetData.filter(v=>v.status===x).length})),kmv=fleetData.map(v=>({label:`${v.plate} · ${v.brand}`,value:v.mileage||0,note:v.status})).sort((a,b)=>b.value-a.value);return `<div class="report-grid"><div class="card section"><h3>🚐 Disponibilidad de flotilla</h3>${donutChart(st,'vehículos')}</div><div class="card section"><h3>🛣️ Kilometraje acumulado por unidad</h3>${hbarChart(kmv,{suffix:' km',maxItems:10})}</div></div><div class="card section"><table class="table"><thead><tr><th>Vehículo</th><th>Estado</th><th>KM</th><th>Mantenimiento</th><th>Seguro</th></tr></thead><tbody>${fleetData.map(v=>`<tr><td>${v.brand} ${v.model} · ${v.plate}</td><td>${badge(v.status)}</td><td>${fmt1(v.mileage)}</td><td>${v.nextMaintenance}</td><td>${v.insuranceExpiry}</td></tr>`).join('')}</tbody></table></div>`}if(tab==='cost'){let costs=ms.map(m=>({label:m.name,value:fuel.filter(f=>f.messengerId===m.id).reduce((s,x)=>s+Number(x.amount||0)+Number(x.depreciation||0),0)})).filter(x=>x.value).sort((a,b)=>b.value-a.value),gas=fuel.reduce((s,x)=>s+Number(x.amount||0),0),dep=fuel.reduce((s,x)=>s+Number(x.depreciation||0),0);return `<di   if(cmd==='csvImportModal()')return csvImportModal();
  if(cmd==='closeModal();csvImportModal()'){closeModal();return csvImportModal()}
  if(cmd==='photoOCRModal()')return photoOCRModal();
  if(cmd==='closeModal();photoOCRModal()'){closeModal();return photoOCRModal()}
  if(cmd==='scanCodeModal()')return scanCodeModal();
  if(cmd==='closeModal();scanCodeModal()'){closeModal();return scanCodeModal()}
  if(cmd==='fuelModal()')return fuelModal();
  if(cmd==='importMenu()')return importMenu();
  if(cmd==='messengerModal()')return messengerModal();
  if(cmd==='newOrderModal()')return newOrderModal();
  if(cmd==='panelAssignModal()')return panelAssignModal();
  if(cmd==='sharePanelRequest()')return sharePanelRequest();
  if(cmd==='vehicleModal()')return vehicleModal();
  if(cmd==='exportDashboardExcel()')return exportDashboardExcel();
  if(cmd==='exportEvidenceIndex()')return exportEvidenceIndex();
  if(cmd==='window.print()')return window.print();
  if(cmd==='closeModal();window.print()'){closeModal();return window.print()}
  if(cmd==="CURRENT='clients';closeModal();renderPage()"){CURRENT='clients';closeModal();return renderPage()}
  if(cmd==="CURRENT='reports';renderPage()"){CURRENT='reports';return renderPage()}
  if(cmd==="exportCSV(STATE.orders,'pedidos_imfohsa')")return exportCSV(STATE.orders,'pedidos_imfohsa');
  if(cmd==="exportCSV(ordersForDate(selectedDate()),'pedidos_'+selectedDate())")return exportCSV(ordersForDate(selectedDate()),'pedidos_'+selectedDate());
  if(cmd==="exportCSV(ordersForPeriod(sessionStorage.getItem('reportPeriod')||'day',selectedDate()),'reporte_'+selectedDate())")return exportCSV(ordersForPeriod(sessionStorage.getItem('reportPeriod')||'day',selectedDate()),'reporte_'+selectedDate());
  if((m=cmd.match(/^clientModal\('([^']+)'\)$/)))return clientModal(m[1]);
  if((m=cmd.match(/^editStop\('([^']+)'\)$/)))return editStop(m[1]);
  if((m=cmd.match(/^managePanelRequest\('([^']+)'\)$/)))return managePanelRequest(m[1]);
  if((m=cmd.match(/^messengerModal\('([^']+)'\)$/)))return messengerModal(m[1]);
  if((m=cmd.match(/^optimizeOne\('([^']+)'\)$/)))return optimizeOne(m[1]);
  if((m=cmd.match(/^orderDetail\('([^']+)'\)$/)))return orderDetail(m[1]);
  if((m=cmd.match(/^shareDriver\('([^']+)'\)$/)))return shareDriver(m[1]);

  if((m=cmd.match(/^vehicleModal\('([^']+)'\)$/)))return vehicleModal(m[1]);
  if((m=cmd.match(/^location\.href='tel:(.*)'$/))){location.href='tel:'+m[1];return}
  if((m=cmd.match(/^window\.open\('([^']+)','_blank'\)$/)))return window.open(m[1],'_blank');
  throw new Error('Acción no reconocida: '+cmd);
}

function shareMessageWhatsApp(phone,message){
  let digits=String(phone||'').replace(/\D/g,'');
  if(digits.length===8)digits='502'+digits;
  let u=(digits?'https://wa.me/'+digits:'https://wa.me/')+'?text='+encodeURIComponent(message);
  window.open(u,'_blank');
}
function shareMessageEmail(subject,message,email=''){
  location.href='mailto:'+encodeURIComponent(email||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(message);
}
async function activatePublicPath(path,inputId,statusId){
  let input=$('#'+inputId),status=$('#'+statusId);
  if(status)status.innerHTML='<span class="pill status-orange">⏳ Preparando enlace HTTPS…</span>';
  try{await api('/api/tunnel/restart',{method:'POST'})}catch{}
  for(let i=0;i<45;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      let info=await api('/api/info');
      if(info.publicUrl){
        let u=String(info.publicUrl).replace(/\/$/,'')+path;
        if(input)input.value=u;
        if(status)status.innerHTML='<span class="pill status-green">✅ Enlace HTTPS listo</span>';
        toast('Enlace público listo');
        return u;
      }
    }catch{}
  }
  if(status)status.innerHTML='<span class="pill status-orange">No se obtuvo HTTPS. Puede usar el enlace LAN dentro de la misma red.</span>';
  toast('El enlace público aún no está disponible','err');
  return input?.value||'';
}

async function remoteCameraSession(label,owner,onComplete,{min=1,max=5,kind='evidence',phones=''}={}){
  try{
    let r=await api('/api/capture/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,owner,min,max,kind})});
    let id=r.id,path=r.path||('/captura?session='+encodeURIComponent(id)),url=r.url;
    let defaultPhone=phones||person(owner)?.phone||STATE?.settings?.capturePhones||'';
    openModal('📱 Cámara enlazada con el teléfono',`
      <div id="remotePublicStatus">${r.publicReady?'<span class="pill status-green">✅ Enlace HTTPS listo</span>':'<div class="insight">El enlace actual funciona dentro de la misma red. Para otro Internet/datos móviles active el enlace público HTTPS.</div>'}</div>
      <div class="field" style="margin-top:10px"><label>Enlace para abrir la cámara</label><input id="remoteCamUrl" class="input" value="${esc(url)}" readonly></div>
      <div class="field" style="margin-top:10px"><label>Teléfono WhatsApp destinatario</label><input id="remotePhone" class="input" inputmode="tel" value="${esc(defaultPhone)}" placeholder="Ej. 55551234"></div>
      <div class="list-actions" style="margin-top:10px">
        <button id="copyRemoteCam" class="btn btn-soft">📋 Copiar enlace</button>
        <button id="waRemoteCam" class="btn btn-primary">💬 Enviar por WhatsApp</button>
        <button id="publicRemoteCam" class="btn btn-ghost">🌐 Activar enlace público</button>
      </div>
      <div class="camera-box" style="margin-top:12px"><b>Fotos recibidas: <span id="remoteCount">0</span>/${max}</b><div id="remoteThumbs" class="thumbs"></div><div class="small" id="remoteHint">Esperando fotografías del teléfono…</div></div>`,
      [{text:'Usar fotos recibidas',cls:'btn-primary',fn:async()=>{
        let st=await api('/api/capture/status?id='+encodeURIComponent(id));
        if((st.urls||[]).length<min)return toast(`Se requieren al menos ${min} foto(s)`,'err');
        await api('/api/capture/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});

      if(!document.getElementById('remoteCount')){clearInterval(timer);return}
      try{
        let st=await api('/api/capture/status?id='+encodeURIComponent(id)),urls=st.urls||[];
        $('#remoteCount').textContent=urls.length;
        $('#remoteThumbs').innerHTML=urls.map(x=>`<img class="thumb" src="${x}">`).join('');
        $('#remoteHint').textContent=urls.length>=min?'✓ Evidencia mínima recibida':'Esperando fotografías del teléfono…';
      }catch{}
    },1500);
  }catch(e){toast('No se pudo crear el enlace de cámara: '+e.message,'err')}
}

/* ==========================================================
   R7.5 — TOKENIZACIÓN MÓVIL Y RECUPERACIÓN DE CONEXIÓN
   ========================================================== */
async function api(url,opt={}){
  let last;
  for(let i=0;i<3;i++){
    try{
      let ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),10000);
      let r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,signal:opt.signal||ctrl.signal});
      clearTimeout(tm);
      if(!r.ok){let txt=await r.text();let e=new Error(txt||r.statusText);e.status=r.status;throw e}
      let ct=r.headers.get('content-type')||'';
      return ct.includes('json')?r.json():r.text();
    }catch(e){
      last=e;
      if(e.status)throw e;
      await new Promise(r=>setTimeout(r,350*(i+1)));
    }
  }
  let e=new Error('Servidor no disponible. Mantenga abierta la ventana negra de IMFOHSA y verifique el puerto 8815.');
  e.cause=last;throw e;
}
function startRealtime(){
  if(eventSource){try{eventSource.close()}catch{} eventSource=null}
  if(window._statePoll){clearInterval(window._statePoll);window._statePoll=null}
  let publicMode=/trycloudflare\.com$/i.test(location.hostname);
  if(publicMode){
    window._statePoll=setInterval(async()=>{try{let s=await api('/api/state');if(STATE&&Number(s.version)>Number(STATE.version)){STATE=s;renderPage(false)}}catch{}},5000);
    return;
  }
  try{
    eventSource=new EventSource('/api/events');
    eventSource.onmessage=async e=>{let v=Number(e.data);if(STATE&&v>STATE.version){try{await loadState();renderPage(false)}catch{}}};
    eventSource.onerror=()=>{try{eventSource.close()}catch{};eventSource=null;window._statePoll=setInterval(async()=>{try{let s=await api('/api/state');if(STATE&&Number(s.version)>Number(STATE.version)){STATE=s;renderPage(false)}}catch{}},5000)};
  }catch{window._statePoll=setInterval(async()=>{try{let s=await api('/api/state');if(STATE&&Number(s.version)>Number(STATE.version)){STATE=s;renderPage(false)}}catch{}},5000)}
}
async function ensurePublicUrl(path,inputId,statusId){
  let input=$('#'+inputId),status=$('#'+statusId);
  try{
    let info=await api('/api/info');
    if(info.publicUrl){
      let u=String(info.publicUrl).replace(/\/$/,'')+path;
      if(input)input.value=u;if(status)status.innerHTML='<span class="pill status-green">✅ Enlace HTTPS activo</span>';
      return u;
    }
    if(status)status.innerHTML='<span class="pill status-orange">⏳ Preparando enlace HTTPS…</span>';
    await api('/api/tunnel/restart',{method:'POST'});
    for(let i=0;i<60;i++){
      await new Promise(r=>setTimeout(r,2000));
      info=await api('/api/info');
      if(info.publicUrl){
        let u=String(info.publicUrl).replace(/\/$/,'')+path;
        if(input)input.value=u;if(status)status.innerHTML='<span class="pill status-green">✅ Enlace HTTPS activo</span>';
        return u;
      }
    }
    throw new Error('No se obtuvo enlace HTTPS. Use el enlace LAN si el teléfono está en la misma red.');
  }catch(e){if(status)status.innerHTML='<span class="pill status-red">⚠ '+esc(e.message)+'</span>';toast(e.message,'err');return input?.value||''}
}

   R7.5 — ENLACES DIRECTOS + SERVIDOR AUTORRECUPERABLE
   ========================================================== */
const R74_PORT=8815;
let _apiFailCount=0;
async function api(url,opt={}){
  let last=null;
  for(let i=0;i<7;i++){
    try{
      let ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),7000);
      let r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,signal:opt.signal||ctrl.signal});
      clearTimeout(tm);
      if(!r.ok){let txt=await r.text();let e=new Error(txt||r.statusText);e.status=r.status;throw e}
      let ct=r.headers.get('content-type')||'';_apiFailCount=0;setServerBadge(true);
      return ct.includes('json')?r.json():r.text();
    }catch(e){
      last=e;if(e.status)throw e;_apiFailCount++;setServerBadge(false);
      await new Promise(r=>setTimeout(r,400+350*i));
    }
  }

async function verifyHttpsLink(u){

   R7.5.2 — ESTABILIDAD LOCAL + LINKS SIN BLOQUEAR EL SERVIDOR
   ========================================================== */
async function api(url,opt={}){
  let last=null;
  for(let i=0;i<3;i++){
    let ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),5000);
    try{
      let fetchOpt={credentials:'same-origin',cache:'no-store',...opt};if(!fetchOpt.signal)fetchOpt.signal=ctrl.signal;
      let r=await fetch(url,fetchOpt);clearTimeout(tm);
      if(!r.ok){let txt=await r.text();let e=new Error(txt||r.statusText);e.status=r.status;throw e}
      let ct=r.headers.get('content-type')||'';_apiFailCount=0;setServerBadge(true);return ct.includes('json')?r.json():r.text();
    }catch(e){clearTimeout(tm);last=e;if(e.status)throw e;if(i<2)await new Promise(r=>setTimeout(r,300+300*i))}
  }
  setServerBadge(false);let e=new Error('Servidor local sin respuesta. Espere 2 segundos y vuelva a intentar.');e.cause=last;throw e;
}

  if(window._connWatch)clearInterval(window._connWatch);let fails=0;

  window._connWatch=setInterval(ping,5000);setTimeout(ping,400);
}

function r17Norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ')}
function r17AddrKey(v){return r17Norm(v).replace(/[.,#]/g,'')}
function r17Coord(lat,lng){return Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))&&Math.abs(Number(lat))<=90&&Math.abs(Number(lng))<=180&&!(Number(lat)===0&&Number(lng)===0)}
function r17EnsureAddresses(c){
  c.addresses=Array.isArray(c.addresses)?c.addresses:[];
  if(c.address&& !c.addresses.some(a=>r17AddrKey(a.address)===r17AddrKey(c.address))) c.addresses.unshift({id:'a'+Date.now()+Math.random().toString(16).slice(2,5),address:c.address,lat:c.lat??null,lng:c.lng??null,source:'registro previo',createdAt:c.createdAt||new Date().toISOString()});
  return c.addresses;
}
function r17AddClientAddress(c,address,lat,lng,source='operación'){
  if(!address)return null;r17EnsureAddresses(c);let key=r17AddrKey(address),found=c.addresses.find(a=>r17AddrKey(a.address)===key);
  if(found){if(r17Coord(lat,lng)){found.lat=Number(lat);found.lng=Number(lng)};return found}
  let a={id:'a'+Date.now()+Math.random().toString(16).slice(2,6),address:address.trim(),lat:r17Coord(lat,lng)?Number(lat):null,lng:r17Coord(lat,lng)?Number(lng):null,source,createdAt:new Date().toISOString()};c.addresses.push(a);return a;
}

  STATE.clients=STATE.clients||[];let code=String(o.odoo||o.clientOdoo||'').trim(),name=r17Norm(o.clientName),phone=String(o.phone||'').replace(/\D/g,'');
  let c=STATE.clients.find(x=>(code&&String(x.odoo||'').trim()===code)||(name&&r17Norm(x.name)===name)||(phone&&String(x.phone||'').replace(/\D/g,'')===phone));
  if(!c){c={id:'c'+Date.now()+Math.random().toString(16).slice(2,6),odoo:code||'AUTO-'+String(STATE.clients.length+1).padStart(4,'0'),name:o.clientName||'Cliente',phone:o.phone||'',address:o.address||'',lat:o.lat??null,lng:o.lng??null,addresses:[],photos:[],source:'Planificador',createdAt:new Date().toISOString()};STATE.clients.push(c)}
  c.name=o.clientName||c.name;c.phone=o.phone||c.phone;c.photos=c.photos||[];if(photo&&!c.photos.includes(photo))c.photos.push(photo);
  let a=r17AddClientAddress(c,o.address,o.lat,o.lng,'gestión '+String(o.orderNo||''));if(a){c.address=a.address;c.lat=a.lat;c.lng=a.lng;o.clientAddressId=a.id}o.clientId=c.id;return c;
}

function r760EnsureState(){
  if(!STATE)return;
  STATE.settings=STATE.settings||{};
  STATE.routeLearning=STATE.routeLearning||[];
  STATE.dispatchDocuments=STATE.dispatchDocuments||[];
  STATE.inventoryLedger=STATE.inventoryLedger||[];
  STATE.warehouseMovements=STATE.warehouseMovements||[];
  STATE.improvementReports=STATE.improvementReports||[];
  STATE.dailyAvailability=STATE.dailyAvailability||{};
  Object.assign(STATE.settings,{
    expressSlaMinutes:Number(STATE.settings.expressSlaMinutes||120),
    weeklyShiftRotationEnabled:STATE.settings.weeklyShiftRotationEnabled!==false,
    estimatedOrdersPerCollectionBatch:Number(STATE.settings.estimatedOrdersPerCollectionBatch||8),
    internalCollectionVehicle:STATE.settings.internalCollectionVehicle||'Moto 125cc'
  });
}
function r760Norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function r760Warehouse(code=''){
  let u=String(code).toUpperCase();
  if(u.startsWith('CDZ16'))return 'CDZ16';
  if(u.startsWith('BUSAC'))return 'BUSAC';
  if(u.startsWith('BZ4')||u.startsWith('B-REP')||u.startsWith('B-TPR')||u.startsWith('B-PCE'))return 'BZ4';
  if(u.startsWith('CDXEL'))return 'CDXEL';

function r760NextOperatingDate(d){
  let x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12,0,0,0);
  if(x.getDay()===0)x.setDate(x.getDate()+1); // operación L-S; domingo pasa a lunes
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function r760OperationalSlot(at=new Date()){
  let d=new Date(at),mins=d.getHours()*60+d.getMinutes(),date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(d.getDay()===0)return {date:r760NextOperatingDate(d),cut:'08:00',reason:'Siguiente día operativo'};
  if(mins<=8*60)return {date,cut:'08:00',reason:'Acumulado posterior al último corte anterior hasta 08:00'};
  if(mins<=9*60+30)return {date,cut:'09:30',reason:'Posterior a 08:00 hasta 09:30'};
  if(mins<=12*60+30)return {date,cut:'12:30',reason:'Posterior a 09:30 hasta 12:30'};
  if(mins<=14*60)return {date,cut:'14:00',reason:'Posterior a 12:30 hasta 14:00'};
  return {date:r760NextOperatingDate(d),cut:'08:00',reason:'Posterior al último corte; primer corte del siguiente día operativo'};
}
function r760WeekKey(date=selectedDate()){let d=parseLocalDate(date);return `${d.getFullYear()}-W${String(r760IsoWeek(date)).padStart(2,'0')}`}

  let wk=r760WeekKey(date),e=(STATE.routeLearning||[]).filter(x=>x?.type==='r760_week_group'&&x.messengerId===mid&&x.week===wk).sort((a,b)=>String(a.at||'').localeCompare(String(b.at||''))).pop();
  return e?.group||person(mid)?.baseGroup||'A';

r760EntryTime=function(m,date=selectedDate()){

function r760SeqTimeline(seq,index,matrix,cut,model){

orderDetail=function(id){let o=STATE.orders.find(x=>x.id===id);if(!o)return;let attempts=o.attemptHistory||[],addr=o.addressHistory||[],vals=o.valueHistory||[];openModal('Historial · '+o.orderNo,`<div class="formgrid"><div><b>Cliente</b><div>${esc(o.clientName)}</div></div><div><b>Estado</b><div>${badge(o.status)}</div></div><div><b>Valor actual</b><div>${fmtQ(o.amount||0)}</div></div><div><b>Intentos fallidos</b><div>${r770AttemptCount(o)} / 3</div></div><div class="wide"><b>Dirección actual</b><div>${esc(o.address||'')}</div></div></div><div class="divider"></div><h3>Intentos de entrega</h3>${attempts.map((a,i)=>`<div class="insight"><b>Intento ${a.attemptNo||i+1}</b> · ${a.at?new Date(a.at).toLocaleString('es-GT'):''}<br>${esc(a.reason||'')} · Responsable: <b>${esc(a.responsible||'—')}</b> · ${esc(a.causeType||'')}<br>${esc(a.notes||'')}</div>`).join('')||'<div class="small">Sin intentos fallidos.</div>'}<h3>Historial de direcciones</h3>${addr.map(a=>`<div class="small" style="padding:6px 0;border-bottom:1px solid #e5e9ef">${a.at?new Date(a.at).toLocaleString('es-GT'):''} · ${esc(a.source||'')}<br><s>${esc(a.oldAddress||'')}</s> → <b>${esc(a.newAddress||'')}</b></div>`).join('')||'<div class="small">Sin cambios de dirección.</div>'}<h3>Auditoría de valor</h3>${vals.map(a=>`<div class="small">${a.at?new Date(a.at).toLocaleString('es-GT'):''} · ${esc(a.user||'')} · ${fmtQ(a.oldValue||0)} → <b>${fmtQ(a.newValue||0)}</b> · ${esc(a.note||'')}</div>`).join('')||'<div class="small">Sin cambios registrados.</div>'}<h3>Evidencias / devolución</h3><div class="thumbs">${(o.photos||[]).map(x=>`<img class="thumb" src="${x}">`).join('')}${(o.returnPhotos||[]).map(x=>`<img class="thumb" src="${x}">`).join('')}</div>`,[{text:'Imprimir / PDF',cls:'btn-primary',fn:()=>printOrderDirect(id)},{text:'Cerrar',fn:closeModal}])};

driverStopHTML=function(o,current){let final=['Entregado','No entregado','Anulado'].includes(o.status),wait=o.status==='En cliente'?minuteDiff(o.serviceStartedAt||o.arrivedAt):0,waiting=o.status==='En cliente'&&!o.serviceStartedAt,service=o.status==='En cliente'&&!!o.serviceStartedAt,canArrive=current&&!final&&o.status!=='En cliente',canClose=current&&!final&&o.status==='En cliente';return `<div class="card mobile-stop ${current?'current':''}" id="ds-${o.id}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${opIcon(o.operationType)} ${esc(o.clientName)}</b><div class="small">${esc(o.address)}</div></div>${badge(o.status)}</div><div class="small" style="margin-top:7px">SO ${esc(o.orderNo)} · Corte ${esc(o.cut)} · Intento ${Math.min(3,r770AttemptCount(o)+1)}</div>${waiting?`<div class="insight">⏱ <b>Esperando cliente</b> · <span class="timer" data-wait="${o.id}">${minuteDiff(o.arrivedAt)}:00</span> · alertas 5/10/15 min</div>`:''}${service?`<div class="insight"><b>🤝 Cliente atendiendo</b> · tiempo de atención <span class="timer" data-service-time="${o.id}">${wait}:00</span>. Este tiempo se mide aparte y puede superar 15 min.</div>`:''}<div class="actions4"><button class="btn btn-soft" data-nav="${o.id}" ${current&&!final?'':'disabled'}>🧭 Navegar</button><button class="btn btn-ghost" data-phone="${esc(o.phone||'')}" ${current&&!final&&o.phone?'':'disabled'}>☎ Llamar</button><button class="btn btn-dark" data-arrive="${o.id}" ${canArrive?'':'disabled'}>📍 Llegué</button><button class="btn btn-primary" data-deliver="${o.id}" ${canClose?'':'disabled'}>✅ Entregar</button></div>${waiting?`<button class="btn btn-soft" data-service="${o.id}" style="margin-top:8px;width:100%">🤝 Cliente ya me está atendiendo</button>`:''}<button class="btn btn-danger" data-fail="${o.id}" style="margin-top:8px" ${canClose?'':'disabled'}>No entregado / incidencia</button></div>`};

function r770DriverDaypart(){let active=String(currentDriverData?.messenger?.activeDaypart||'').toUpperCase();if(active==='AM'||active==='PM')return active;let o=(currentDriverData?.orders||[]).find(x=>!['Entregado','No entregado','Anulado'].includes(x.status))||(currentDriverData?.orders||[])[0];return r770Shift(o?.cut)}
driverStartRoute=function(){let m=currentDriverData?.messenger,assigned=m?.routeAssignedAt?new Date(m.routeAssignedAt):null,grace=Number(currentDriverData?.settings?.routeDispatchGraceMinutes||10),late=assigned?Date.now()>assigned.getTime()+grace*60000:false;cameraCapture('Foto obligatoria del tacómetro / odómetro inicial',url=>{openModal('Kilometraje inicial · '+r770DriverDaypart(),`<img src="${url}" style="width:100%;border-radius:10px"><div class="field" style="margin-top:10px"><label>Lectura inicial (km)</label><input id="odoStart" type="number" class="input"></div>${late?`<div class="insight"><b>Salida posterior al límite.</b> Debe registrar la causa para que el KPI distinga si fue atribuible al mensajero.</div><div class="field"><label>Responsable del atraso</label><select id="r770LateResp" class="select"><option>Mensajero</option><option>Bodega</option><option>Logística</option><option>Sistema</option><option>Pedido pendiente</option><option>Otro</option></select></div><div class="field"><label>Motivo</label><input id="r770LateReason" class="input"></div>`:''}`,[{text:'Confirmar e iniciar ruta',cls:'btn-primary',fn:async()=>{let od=Number($('#odoStart').value);if(!od)return toast('Ingrese lectura del odómetro','err');await driverAction({action:'startRoute',photo:url,odometer:od,daypart:r770DriverDaypart(),delayResponsible:late?$('#r770LateResp').value:'',delayReason:late?$('#r770LateReason').value.trim():''});closeModal();await refreshDriver()}},{text:'Cancelar',fn:closeModal}])})};
driverCloseRoute=function(){let part=r770DriverDaypart();cameraCapture('Foto obligatoria del tacómetro / odómetro final',url=>{openModal('Cerrar ruta '+part+' en CEDI',`<img src="${url}" style="width:100%;border-radius:10px"><div class="field"><label>Lectura final del odómetro</label><input id="odoEnd" class="input" type="number"></div>`,[{text:'Cerrar ruta '+part,cls:'btn-primary',fn:async()=>{let od=Number($('#odoEnd').value);if(!od)return toast('Ingrese lectura final','err');await driverAction({action:'closeRoute',photo:url,odometer:od,daypart:part});closeModal();await refreshDriver()}},{text:'Cancelar',fn:closeModal}])})};
startDriverWaitAlerts=function(){clearInterval(driverTimer);let last={};driverTimer=setInterval(()=>{if(!currentDriverData)return;let md=currentDriverData.messenger,grace=Number(currentDriverData.settings.routeDispatchGraceMinutes||10);if((md.routeStatus||'Pendiente')==='Pendiente'&&md.routeAssignedAt){let mins=Math.floor((Date.now()-new Date(md.routeAssignedAt))/60000);if((mins===5||mins>=grace&&mins%5===0)&&last.start!==mins){last.start=mins;alert(mins<grace?`Han pasado 5 minutos desde que recibió la ruta. Salida máxima en ${grace-mins} min.`:`SALIDA TARDÍA: superó el límite de ${grace} minutos.`)}}currentDriverData.orders.forEach(o=>{if(o.status!=='En cliente')return;if(o.serviceStartedAt){let sec=Math.max(0,Math.floor((Date.now()-new Date(o.serviceStartedAt))/1000)),el=$(`[data-service-time="${o.id}"]`);if(el)el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');return}if(o.arrivedAt){let sec=Math.max(0,Math.floor((Date.now()-new Date(o.arrivedAt))/1000)),m=Math.floor(sec/60),el=$(`[data-wait="${o.id}"]`);if(el)el.textContent=m+':'+String(sec%60).padStart(2,'0');if([5,10,15].includes(m)&&sec%60===0&&last[o.id]!==m){last[o.id]=m;alert(m===15?`LÍMITE NORMAL DE ESPERA: 15 minutos en ${o.clientName}. Si el cliente ya lo atiende, pulse “Cliente ya me está atendiendo”.`:`Alerta de espera: ${m} minutos en ${o.clientName}.`)}}})},1000)};

function messengerBitacora(mid,part='ALL'){let date=selectedDate();if(part==='ALL')return openModal('Bitácora del mensajero · '+(person(mid)?.name||''),r770BitacoraHTML(mid,date,'AM')+'<div class="divider"></div>'+r770BitacoraHTML(mid,date,'PM'),[{text:'🖨 Imprimir AM',cls:'btn-soft',fn:()=>r770PrintBitacora(mid,date,'AM')},{text:'🖨 Imprimir PM',cls:'btn-soft',fn:()=>r770PrintBitacora(mid,date,'PM')},{text:'Cerrar',fn:closeModal}]);openModal('Bitácora '+part,r770BitacoraHTML(mid,date,part),[{text:'Imprimir',cls:'btn-primary',fn:()=>r770PrintBitacora(mid,date,part)},{text:'Cerrar',fn:closeModal}])}

function r773ApproxGeo(o){
  return /aproximada de prueba|aproximad/i.test(String(o?.geoValidationSource||''));
}
r7515GeoOK=function(o){
  return !!(o?.address&&Number.isFinite(Number(o.lat))&&Number.isFinite(Number(o.lng))&&o.geoValidated!==false&&!r773ApproxGeo(o));
};

async function r773ValidateAddresses(){
  if(!r770CanOperate())return toast('Permiso insuficiente','err');
  let date=selectedDate(),cid=sessionStorage.getItem('planCenter')||'cedi16';
  let rows=(STATE.orders||[]).filter(o=>o.date===date&&(o.centerId||'cedi16')===cid&&o.address&&(!r7515GeoOK(o)||r773ApproxGeo(o)));
  if(!rows.length)return toast('Todas las direcciones visibles ya tienen punto validado');
  if(!String(STATE.settings?.googleMapsApiKey||'').trim())return toast('Primero configure Google Maps Demo Key en Configuración','err');
  openModal('Validar direcciones con Google',`<div class="insight"><b>${rows.length} dirección(es) requieren validación.</b><br>Se reemplazarán únicamente los puntos aproximados. La dirección escrita y su historial no se borran.</div><div id="r773GeoProgress" class="small">Listo para iniciar.</div>`,[
    {text:'Validar ahora',cls:'btn-primary',fn:async()=>{let ok=0,fail=0,box=$('#r773GeoProgress');for(let i=0;i<rows.length;i++){let o=rows[i];box.textContent=`Validando ${i+1}/${rows.length} · ${o.orderNo} · ${o.address}`;try{let g=await api('/api/geocode?q='+encodeURIComponent(o.address));if(g?.found&&Number.isFinite(Number(g.lat))&&Number.isFinite(Number(g.lng))){o.lat=Number(g.lat);o.lng=Number(g.lng);o.geoValidated=true;o.geoValidationSource='Google Geocoding · dirección validada';o.geoValidatedAt=new Date().toISOString();ok++}else{fail++}}catch(e){fail++}}await saveState(`Validación geográfica: ${ok} correctas · ${fail} pendientes`);closeModal();renderPlanner();toast(`${ok} dirección(es) validadas · ${fail} pendientes`,fail?'err':'ok')}} ,
    {text:'Cancelar',fn:closeModal}
  ]);
}

async function r773PublishRoute(mid){
  let date=selectedDate(),m=person(mid),selected=sessionStorage.getItem('planCut')||'ALL';
  if(!m)return toast('Mensajero no encontrado','err');
  let rows=(STATE.orders||[]).filter(o=>o.date===date&&o.messengerId===mid&&!['Entregado','No entregado','Anulado'].includes(o.status)&&(selected==='ALL'||o.cut===selected));
  if(!rows.length)return toast('No hay gestiones asignadas para enviar','err');
  let invalid=rows.filter(o=>!r7515GeoOK(o));
  if(invalid.length)return toast(`${invalid.length} gestión(es) aún tienen ubicación aproximada o pendiente. Valide las direcciones antes de enviar la ruta.`,'err');
  let now=new Date().toISOString();
  m.routePublishedAt=now;m.routePublishedDate=date;
  // Compatibilidad: todos los cronómetros existentes toman routeAssignedAt.
  // Se redefine aquí para que el reloj empiece cuando Logística ENTREGA la ruta, no cuando apenas la asigna.
  m.routeAssignedAt=now;m.routeAssignedDate=date;m.routeStatus='Pendiente';m.routeStartedAt='';m.routeEndedAt='';m.returnCediAt='';
  rows.forEach(o=>{o.routePublishedAt=now;o.routePublishedDate=date;o.status=o.status==='Pendiente'?'Asignado':o.status});
  if(typeof r760Record==='function')r760Record('r773_route_published',{date,messengerId:mid,cut:selected,orderIds:rows.map(o=>o.id),at:now});
  await saveState(`Ruta entregada a ${m.name} · inicia control de salida 5/10 min`);
  toast(`Ruta enviada a ${m.name}. Ya está disponible en su usuario y comenzó el control de salida.`);
  renderPlanner();
}
